/* --- turning Supabase errors into plain language --- */
function explainDbError(err) {
  var code = err && err.code, msg = (err && err.message) || '';
  if (code === 'PGRST205' || code === '42P01') return 'The table "public.' + DB_TABLE + '" was not found in your Supabase project.';
  if (code === 'PGRST204' || code === '42703') return 'The table "' + DB_TABLE + '" does not have the columns this app expects ("' + DB_USER_COL + '" and "' + DB_DATA_COL + '"). Details: ' + msg;
  if (code === '42501' || /row-level security|permission denied/i.test(msg)) return 'Supabase blocked this request (Row Level Security). The policies must let a signed-in user read, insert and update rows where ' + DB_USER_COL + ' equals their own user ID.';
  if (/failed to fetch|networkerror|network request failed|load failed/i.test(msg)) return 'Could not reach Supabase. Check your internet connection.';
  return 'Supabase said: ' + (msg || 'unknown error') + (code ? ' (code ' + code + ')' : '');
}
function friendlyAuthError(err) {
  var code = err && err.code, msg = (err && err.message) || '';
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return 'Email or password is incorrect.';
  if (code === 'email_not_confirmed' || /email not confirmed/i.test(msg)) return 'Please confirm your email first. Check your inbox for the confirmation link.';
  if (code === 'user_already_exists' || /already registered/i.test(msg)) return 'An account with this email already exists. Try logging in.';
  if (code === 'weak_password' || /password should be|weak/i.test(msg)) return 'That password is too weak. Use at least 8 characters with letters and numbers.';
  if (code === 'signup_disabled' || /signups not allowed/i.test(msg)) return 'New sign-ups are turned off for this project.';
  if ((err && err.status === 429) || code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit' || /rate limit|too many/i.test(msg)) return 'Too many attempts. Wait a minute and try again.';
  if (code === 'email_address_invalid' || /invalid.*email/i.test(msg)) return 'That email address does not look valid.';
  if (/failed to fetch|networkerror|network request failed|load failed/i.test(msg) || (err && err.name === 'AuthRetryableFetchError')) return 'Could not reach Supabase. Check your internet connection and try again.';
  return msg || 'Something went wrong. Please try again.';
}

/* --- cleaning up data that comes back from the database --- */
function normalizeState(saved, seed) {
  if (!saved || typeof saved !== 'object' || !Array.isArray(saved.expenses) || !Array.isArray(saved.goals)) return null;
  var catIds = CATEGORIES.map(function (c) { return c.id; });
  var expenses = saved.expenses.filter(function (e) {
    return e && typeof e === 'object' && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && isFinite(Number(e.amount));
  }).map(function (e) {
    return {
      id: String(e.id || uid()), date: e.date, amount: Number(e.amount),
      category: catIds.indexOf(e.category) !== -1 ? e.category : 'other',
      description: String(e.description == null ? '' : e.description), created: Number(e.created) || 0
    };
  });
  var goals = saved.goals.filter(function (g) {
    return g && typeof g === 'object' && g.name != null && isFinite(Number(g.target));
  }).map(function (g) {
    return {
      id: String(g.id || uid()), name: String(g.name), target: Number(g.target),
      saved: Number(g.saved) || 0, date: typeof g.date === 'string' ? g.date : '', created: Number(g.created) || 0
    };
  });
  var chat = Array.isArray(saved.chat) ? saved.chat.filter(function (m) {
    return m && (m.role === 'user' || m.role === 'ai') && typeof m.text === 'string';
  }) : [];
  return {
    budget: Number(saved.budget) > 0 ? Number(saved.budget) : seed.budget,
    expenses: expenses, goals: goals,
    chat: chat.length ? chat : seed.chat,
    quizBest: saved.quizBest && typeof saved.quizBest === 'object' ? saved.quizBest : {}
  };
}

/* --- saving: batched, one save at a time, retried if it fails --- */
var SYNC_LABELS = { saved: 'Saved', saving: 'Saving…', pending: 'Saving…', error: 'Not saved. Tap to retry' };
function setSync(s) {
  Sync.status = s;
  document.querySelectorAll('[data-sync]').forEach(function (el) {
    el.textContent = SYNC_LABELS[s];
    el.className = 'sync ' + s;
    el.disabled = s !== 'error';
    el.title = s === 'error' ? Sync.lastError : '';
  });
}
function snapshotState() {
  return JSON.parse(JSON.stringify({ budget: state.budget, expenses: state.expenses, goals: state.goals, chat: state.chat, quizBest: state.quizBest }));
}
function scheduleSave() {
  Sync.dirty = true; Sync.retries = 0; setSync('pending');
  clearTimeout(Sync.timer); Sync.timer = setTimeout(flush, 500);
}
function flush() {
  clearTimeout(Sync.timer); clearTimeout(Sync.retryTimer);
  if (Sync.saving) return Sync.current || Promise.resolve();
  if (!Sync.dirty || !state || !Database.uid) return Promise.resolve();
  var my = epoch, snapshot = snapshotState();
  Sync.dirty = false; Sync.saving = true; setSync('saving');
  Sync.current = Database.save(snapshot).then(function () {
    if (my !== epoch) return;
    Sync.saving = false; Sync.errShown = false; Sync.retries = 0;
    if (Sync.dirty) return flush();
    setSync('saved');
  }, function (err) {
    if (my !== epoch) return;
    Sync.saving = false; Sync.dirty = true;
    Sync.lastError = explainDbError(err);
    setSync('error');
    console.error('FinWise: saving failed', err);
    if (!Sync.errShown) { Sync.errShown = true; toast('Could not save your changes. ' + Sync.lastError, 6500); }
    if (++Sync.retries <= 5) Sync.retryTimer = setTimeout(flush, 8000);
  });
  return Sync.current;
}
function resetSync() {
  clearTimeout(Sync.timer); clearTimeout(Sync.retryTimer);
  Sync.saving = false; Sync.dirty = false; Sync.current = null; Sync.retries = 0; Sync.errShown = false; Sync.lastError = '';
  setSync('saved');
}

/* --- data saved in this browser by the old version of the app --- */
function readLegacy() {
  try { var raw = localStorage.getItem(LEGACY_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function legacyOwner() {
  try { return localStorage.getItem(LEGACY_KEY + '.owner') || ''; } catch (e) { return ''; }
}
function setLegacyOwner(userId) {
  try { localStorage.setItem(LEGACY_KEY + '.owner', userId); } catch (e) {}
}
/* mode 'adopt': this account has no saved data yet, so it may take the browser data.
   mode 'ask': this account already has data, so the user must choose.
   Browser data that already belongs to another account is never offered to this one. */
function legacyFor(userId, mode) {
  var owner = legacyOwner();
  if (mode === 'adopt' ? (owner && owner !== userId) : owner) return null;
  return normalizeState(readLegacy(), makeSeed());
}
function openLegacyDialog() {
  var n = legacyAsk.data.expenses.length, g = legacyAsk.data.goals.length;
  openDialog(dlgHead('Found data from before you signed in') +
    '<div class="dlg-body"><p>This browser has older FinWise data (' + n + ' expense' + (n === 1 ? '' : 's') + ', ' + g + ' goal' + (g === 1 ? '' : 's') + '). Your account also has saved data. Which should FinWise use?</p>' +
    '<p class="hint">Choosing the browser data replaces what is saved in your account. Nothing is deleted from this browser either way.</p></div>' +
    '<div class="dlg-foot"><button type="button" class="btn btn-ghost" data-action="legacy-skip">Keep my account data</button>' +
    '<button type="button" class="btn btn-primary" data-action="legacy-import">Use browser data instead</button></div>');
}
function importLegacy() {
  if (!legacyAsk || !state || Database.uid !== legacyAsk.uid) { closeDialog(); return; }
  state = legacyAsk.data; setLegacyOwner(legacyAsk.uid); legacyAsk = null;
  closeDialog(); persist(); flush(); render(); toast('Browser data saved to your account', 3500);
}
function skipLegacy() {
  if (legacyAsk) setLegacyOwner(legacyAsk.uid);
  legacyAsk = null; closeDialog(); toast('Keeping your account data');
}

/* --- signing in: load this user's data, then show the app --- */
function enterApp(user) {
  if (state && Database.uid === user.id) return;
  if (entering === user.id) return;
  entering = user.id; bootUser = user;
  var my = ++epoch;
  showBoot('loading', 'Loading your data…');
  Database.load(user.id).then(function (res) {
    if (my !== epoch) return;
    var seed = makeSeed();
    var remote = res.exists ? normalizeState(res.data, seed) : null;
    var hasContent = res.exists && res.data && typeof res.data === 'object' && Object.keys(res.data).length > 0;
    if (hasContent && !remote) {
      var bad = new Error('unreadable data');
      bad.friendly = 'Your saved FinWise data is in a format this version cannot read, so it was left untouched.';
      throw bad;
    }
    var startState, needSave = false, notice = '', ask = null;
    if (remote) {
      startState = remote;
      var lg = legacyFor(user.id, 'ask');
      if (lg) ask = { uid: user.id, data: lg };
    } else {
      var old = legacyFor(user.id, 'adopt');
      if (old) { startState = old; setLegacyOwner(user.id); notice = 'Your existing data from this browser is now saved to your account.'; }
      else startState = seed;
      needSave = true;
    }
    Database.uid = user.id;
    state = startState; entering = null;
    resetSync();
    showApp(user);
    if (needSave) { Sync.dirty = true; flush(); }
    if (notice) toast(notice, 4500);
    if (ask) { legacyAsk = ask; openLegacyDialog(); }
  }).catch(function (err) {
    if (my !== epoch) return;
    entering = null;
    console.error('FinWise: loading failed', err);
    showBoot('error', err.friendly || explainDbError(err));
  });
}
function showApp(user) {
  $('#acct-email').textContent = user.email || '';
  var start = location.hash.slice(1);
  ui.route = VIEWS[start] ? start : 'dashboard';
  showScreen('app');
  render();
  window.scrollTo(0, 0);
}
function leaveApp(quiet) {
  epoch++; resetSync();
  state = null; run = null; pendingConfirm = null; legacyAsk = null;
  Database.uid = null; Database.rowExists = false; entering = null; bootUser = null;
  ui.route = 'dashboard'; ui.expMonth = todayISO().slice(0, 7); ui.expCat = 'all'; ui.expQ = '';
  ui.learnTopic = null; ui.learnTab = 'lesson'; ui.thinking = false;
  closeDialog();
  $('#view').innerHTML = ''; $('#side-nav').innerHTML = ''; $('#tabbar').innerHTML = ''; $('#acct-email').textContent = '';
  if (!quiet) { auth.mode = 'login'; auth.msg = ''; showAuth(); }
}
function signOutNow() {
  function done() { if (state || entering || bootUser) leaveApp(); }
  sb.auth.signOut().then(done, done);
}
function doLogout() {
  if (!state) return;
  toast('Saving and logging out…');
  flush().then(function () {
    if (Sync.dirty) {
      confirmDialog('Some changes are not saved', 'Your latest changes have not reached your account yet. If you log out now they will be lost.', 'Log out anyway', signOutNow);
    } else {
      signOutNow();
    }
  });
}

/* --- login / sign-up screen --- */
function paintAuthMsg() {
  var box = $('#auth-msg'); if (!box) return;
  box.innerHTML = auth.msg ? '<p class="note' + (auth.msgKind === 'error' ? ' error' : '') + '">' + esc(auth.msg) + '</p>' : '';
}
function setAuthMsg(msg, kind) { auth.msg = msg || ''; auth.msgKind = kind || ''; paintAuthMsg(); }
function setAuthBusy(b) {
  auth.busy = b;
  var btn = $('#auth-submit');
  if (btn) { btn.disabled = b; btn.textContent = b ? 'Please wait…' : (auth.mode === 'login' ? 'Log in' : 'Create account'); }
}
function renderAuth() {
  var login = auth.mode === 'login';
  $('#auth').innerHTML =
    '<section class="card auth-card" aria-labelledby="auth-title">' +
    '<div class="brand"><span class="logo-mark" aria-hidden="true">₹</span><span class="brand-text"><span class="brand-name">FinWise <span class="badge-ai">AI</span></span><span class="brand-sub">Student Finance Advisor</span></span></div>' +
    '<div class="auth-badge"><span class="auth-badge-dot"></span> Student-first AI money mentor</div>' +
    '<div><h1 id="auth-title">' + (login ? 'Welcome back' : 'Create your account') + '</h1>' +
    '<p class="muted" style="margin-top:6px">' + (login ? 'Log in to see your budget, goals and progress.' : 'Sign up to keep your expenses and goals saved to your own account.') + '</p></div>' +
    '<div class="tabs" role="group" aria-label="Log in or sign up">' +
    '<button type="button" class="tab" data-action="auth-tab" data-mode="login" aria-pressed="' + login + '">Log in</button>' +
    '<button type="button" class="tab" data-action="auth-tab" data-mode="signup" aria-pressed="' + !login + '">Sign up</button></div>' +
    '<form id="auth-form" class="auth-form" novalidate>' +
    '<div class="field"><label for="auth-email">Email address</label><input class="input" id="auth-email" name="email" type="email" autocomplete="email" inputmode="email" value="' + esc(auth.email) + '" placeholder="you@college.edu">' + errSlot('email') + '</div>' +
    '<div class="field"><label for="auth-password">Password</label><input class="input" id="auth-password" name="password" type="password" autocomplete="' + (login ? 'current-password' : 'new-password') + '" placeholder="' + (login ? 'Your password' : 'At least 8 characters') + '">' + errSlot('password') + '</div>' +
    '<div id="auth-msg" role="alert"></div>' +
    '<button type="submit" class="btn btn-primary" id="auth-submit">' + (login ? 'Log in' : 'Create account') + '</button></form>' +
    '<p class="disclaimer">🔒 Your FinWise data is encrypted and tied to your account.</p></section>';
  paintAuthMsg();
}
function showAuth() {
  auth.busy = false;
  renderAuth();
  showScreen('auth');
  var f = $('#auth-email'); if (f) f.focus();
}
function handleAuthSubmit(form) {
  if (auth.busy) return;
  var email = form.elements.email.value.trim().toLowerCase(), pw = form.elements.password.value, login = auth.mode === 'login', ok = true;
  auth.email = email;
  var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  setErr(form, 'email', emailOk ? '' : 'Enter a valid email address.'); if (!emailOk) ok = false;
  var pwOk = login ? pw.length > 0 : pw.length >= 8;
  setErr(form, 'password', pwOk ? '' : (login ? 'Enter your password.' : 'Use at least 8 characters.')); if (!pwOk) ok = false;
  setAuthMsg('');
  if (!ok) { var bad = form.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); return; }
  setAuthBusy(true);
  var request = login ? sb.auth.signInWithPassword({ email: email, password: pw }) : sb.auth.signUp({ email: email, password: pw });
  request.then(function (res) {
    setAuthBusy(false);
    if (res.error) { setAuthMsg(friendlyAuthError(res.error), 'error'); return; }
    var user = res.data && res.data.user;
    if (!login) {
      if (user && Array.isArray(user.identities) && user.identities.length === 0) {
        setAuthMsg('An account with this email already exists. Try logging in.', 'error'); return;
      }
      if (!res.data.session) {
        auth.mode = 'login'; renderAuth();
        setAuthMsg('Account created. Check your email for a confirmation link, confirm it, then log in here.', 'ok');
        return;
      }
    }
    form.elements.password.value = '';
    if (res.data && res.data.session) enterApp(res.data.session.user);
  }).catch(function (err) {
    setAuthBusy(false);
    setAuthMsg(friendlyAuthError(err), 'error');
  });
}

/* --- reacting to Supabase login state (also runs when the page is reopened) --- */
function handleAuthEvent(event, session) {
  var user = session && session.user;
  if (event === 'SIGNED_OUT') {
    if (state || entering || bootUser) leaveApp(); else showAuth();
    return;
  }
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
    if (user) {
      if (Database.uid && Database.uid !== user.id) leaveApp(true);
      enterApp(user);
    } else if (event === 'INITIAL_SESSION') {
      showAuth();
    }
  }
}

/* --- last-chance saving when the tab is hidden or closed --- */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') flush();
});
window.addEventListener('beforeunload', function (e) {
  if (Sync.dirty || Sync.saving) { e.preventDefault(); e.returnValue = ''; }
});

/* --- boot --- */
var gotAuthEvent = false;
renderAuth();
if (!window.supabase || !window.supabase.createClient) {
  showBoot('fatal', 'The Supabase library could not be loaded. Check your internet connection, then reload this page.');
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
  showBoot('loading', 'Checking your session…');
  sb.auth.onAuthStateChange(function (event, session) {
    gotAuthEvent = true;
    setTimeout(function () { handleAuthEvent(event, session); }, 0);  /* never call Supabase from inside this callback */
  });
  setTimeout(function () {
    if (gotAuthEvent) return;
    sb.auth.getSession().then(function (r) { handleAuthEvent('INITIAL_SESSION', r.data && r.data.session); });
  }, 3000);
}
})();
</script>

</body></html>
